<title>EV Fleet Battery Forecast</title>

<style>
  :root{ --acc:#1f77b4; --acc-dark:#155a8a; }

  h1{font-size:19px;font-weight:700;margin:0}
  .sub{color:#666;font-size:13px;margin:2px 0 0}
  .nav{display:flex;border-bottom:2px solid #e2e2e2;margin-bottom:16px}
  .nav div{font-size:14px;padding:10px 18px;cursor:pointer;color:#666;font-weight:600;
           border-bottom:3px solid transparent;margin-bottom:-2px}
  .nav div.on{color:var(--acc-dark);border-bottom-color:var(--acc)}
  .controls{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
  input,select{font-size:14px;padding:8px 10px;border:1px solid #ccc;border-radius:8px;background:#fff}
  select{min-width:360px}
  .card{background:#fff;border:1px solid #e6e6e6;border-radius:12px;padding:18px 20px}
  .hd{font-size:15px;font-weight:700;color:var(--acc-dark)}
  .hdsub{color:#666;font-size:13px;margin:2px 0 16px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:18px}
  .tile{background:#f4f7fa;border-radius:8px;padding:10px 14px;border-left:3px solid var(--acc)}
    .tlab{font-size:12px;color:#666}.tval{font-size:21px;font-weight:700;margin-top:2px}
  .tval small{font-size:12px;color:#999;font-weight:400}
  .legend{display:flex;gap:14px;font-size:12px;color:#555;margin-bottom:6px;flex-wrap:wrap}
  .legend span{display:flex;align-items:center;gap:5px}
  .sw{width:15px;height:11px;display:inline-block;border-radius:2px}
  .tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .tab{font-size:13px;padding:6px 12px;border:1px solid #ccc;border-radius:20px;background:#fff;cursor:pointer}
  .tab.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:16px}
  th{text-align:left;color:#555;font-weight:600;border-bottom:2px solid #e2e2e2;padding:8px 6px}
  td{padding:8px 6px;border-bottom:1px solid #f0f0f0}
  tr.me{background:#eef5fb}
  .bid{font-weight:600}
  .note{font-size:12px;color:#777;margin-top:12px;line-height:1.5}
  .hide{display:none}
</style></head><body>

<div class="top"><div><h1>EV Fleet Battery Forecast</h1>
  <p class="sub" id="meta"></p></div></div>

<div class="nav">
  <div id="n1" class="on" onclick="page(1)">Battery Forecast</div>
  <div id="n2" onclick="page(2)">Battery Comparison</div>
  <div id="n3" onclick="page(3)">Replacement Plan</div>
</div>

<div class="controls">
  <input id="search" placeholder="Filter by vehicle or battery…" oninput="filt()">
  <select id="pick" onchange="render(this.value)"></select>
</div>

<div id="p1" class="card">
  <div class="hd" id="hd1"></div><div class="hdsub" id="hdsub1"></div>
  <div class="tiles" id="tiles"></div>
  <div class="legend">
    <span><span class="sw" style="background:var(--acc);height:3px"></span>Expected life left (P50)</span>
    <span><span class="sw" style="background:rgba(120,120,120,0.18)"></span>Uncertainty (P10–P90)</span>
    <span><span class="sw" style="background:rgba(44,158,75,0.30)"></span>Healthy 100–66%</span>
    <span><span class="sw" style="background:rgba(240,192,64,0.40)"></span>Caution 66–33%</span>
    <span><span class="sw" style="background:rgba(214,40,40,0.30)"></span>Critical 33–0%</span>
    <span><span class="sw" style="border-top:2px dashed #b00;height:0"></span>Swap point</span>
  </div>
  <div style="position:relative;height:320px"><canvas id="fan"></canvas></div>
</div>

<div id="p2" class="card hide">
  <div class="hd" id="hd2"></div><div class="hdsub" id="hdsub2"></div>
  <div class="tabs">
    <div class="tab on" id="t_fade" onclick="setM('fade')">Fade rate (lower is better)</div>
    <div class="tab" id="t_life" onclick="setM('life')">Full life (cycles)</div>
    <div class="tab" id="t_end" onclick="setM('end')">Discharge time near end of life</div>
  </div>
  <div style="position:relative;height:300px"><canvas id="bars"></canvas></div>
  <div id="tblwrap"></div>
  <p class="note" id="note"></p>
</div>

<div id="p3" class="card hide">
  <div class="hd" id="hd3"></div><div class="hdsub" id="hdsub3"></div>
  <div class="tabs">
    <div class="tab on" id="h_24" onclick="setH(24)">24 months</div>

  </div>
  <div class="tiles" id="ptiles"></div>
  <div style="position:relative;height:300px"><canvas id="pbars"></canvas></div>
  <div id="ptbl"></div>
  <p class="note" id="pnote"></p>
</div>

  var l=VEH.filter(function(t){return label(t).toLowerCase().indexOf(q)>-1;});
  var u=l.length?l:VEH; fillOpts(u); if(u.length) render(document.getElementById('pick').value);}
function page(p){PAGE=p;
  document.getElementById('n1').classList.toggle('on',p===1);
  document.getElementById('n2').classList.toggle('on',p===2);
  document.getElementById('p1').classList.toggle('hide',p!==1);
  document.getElementById('p2').classList.toggle('hide',p!==2);
  document.getElementById('n3').classList.toggle('on',p===3);document.getElementById('p3').classList.toggle('hide',p!==3);document.getElementById('search').parentElement.style.display=(p===3?'none':'flex');if(p===3){draw3();return;}if(CUR){p===1?draw1():draw2();}}
function setM(m){METRIC=m;['fade','life','end'].forEach(function(k){
  document.getElementById('t_'+k).classList.toggle('on',k===m);}); if(CUR)draw2();}
function money(n){return '$'+Math.round(n).toLocaleString();}
function render(i){var t=VEH[i]; if(!t)return; CUR=t; PAGE===1?draw1():draw2();}

// Health zones behind the forecast chart: share of a NEW pack's life left
var zones={id:'zones',beforeDatasetsDraw:function(c){if(!CUR)return;
  var ctx=c.ctx,a=c.chartArea,y=c.scales.y;
  [[9,0.66,'rgba(44,158,75,0.13)'],[0.66,0.33,'rgba(240,192,64,0.18)'],
   [0.33,0,'rgba(214,40,40,0.13)']].forEach(function(z){
    var top=Math.max(y.getPixelForValue(NEWPACK*z[0]),a.top),
        bot=Math.min(y.getPixelForValue(NEWPACK*z[1]),a.bottom);
    if(bot>top){ctx.fillStyle=z[2]; ctx.fillRect(a.left,top,a.right-a.left,bot-top);}});}};

function draw1(){var t=CUR;
  document.getElementById('hd1').textContent='Vehicle '+t.vehicle_id;
  document.getElementById('hdsub1').textContent='Battery '+t.battery_id+' · cycle '+t.cycle.toLocaleString()+
    ' · discharge time '+Math.round(t.discharge_time_s).toLocaleString()+' s (healthy ~1,500 s)';
  document.getElementById('tiles').innerHTML=
    '<div class="tile"><div class="tlab">Pack life left</div><div class="tval">'+Math.round(100*t.pred_rul/NEWPACK)+'<small> %</small></div></div>'+
    '<div class="tile"><div class="tlab">Cycles to swap (P50)</div><div class="tval">'+Math.round(t.c50).toLocaleString()+'</div></div>'+
    '<div class="tile"><div class="tlab">P10–P90 range</div><div class="tval">'+Math.round(t.c10).toLocaleString()+'<small> – '+Math.round(t.c90).toLocaleString()+'</small></div></div>'+
    '<div class="tile"><div class="tlab">Swap in (P50)</div><div class="tval">'+Math.round(t.w50)+'<small> wks</small></div></div>'+
    '<div class="tile"><div class="tlab">Est. cost</div><div class="tval">'+money(t.unit_price+LABOR)+'</div></div>';
  var N=40,xs=[],k; for(k=0;k<=N;k++){xs.push(+(t.w90*k/N).toFixed(1));}
  function line(w){return xs.map(function(x){return x<=w?+(t.pred_rul-(t.pred_rul-BUFFER)*(x/w)).toFixed(1):null;});}
  var ACC=getComputedStyle(document.body).getPropertyValue('--acc').trim()||'#1f77b4';
  var ds=[{data:xs.map(function(){return BUFFER;}),borderColor:'#b00',borderDash:[6,4],borderWidth:1.5,pointRadius:0},
    {data:line(t.w90),borderColor:'transparent',pointRadius:0},
    {data:line(t.w10),borderColor:'transparent',pointRadius:0,backgroundColor:'rgba(120,120,120,0.16)',fill:'-1'},
    {data:line(t.w50),borderColor:ACC,borderWidth:3,pointRadius:0}];
  if(chart1)chart1.destroy();
  chart1=new Chart(document.getElementById('fan'),{type:'line',data:{labels:xs,datasets:ds},plugins:[zones],
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},
      tooltip:{filter:function(i){return i.datasetIndex===3;},callbacks:{
        title:function(c){return 'Week '+c[0].parsed.x;},
        label:function(c){return Math.round(c.parsed.y).toLocaleString()+' cycles left ('+Math.round(100*c.parsed.y/NEWPACK)+'%)';}}}},
      scales:{x:{type:'linear',title:{display:true,text:'Weeks from now'},grid:{display:false}},
              y:{min:0,max:Math.ceil(Math.max(NEWPACK,t.pred_rul)),title:{display:true,text:'Cycles of life left'}}}}});}

var META={fade:{key:'fade_100', lab:'Seconds of discharge time lost per 100 cycles', hi:false},
          life:{key:'full_life',lab:'Full life (cycles)',                           hi:true},
          end: {key:'end_dt',   lab:'Discharge time near end of life (s)',          hi:true}};
function draw2(){var t=CUR,m=META[METRIC],rows=BENCH.slice();
  var rank=BENCH.slice().sort(function(a,b){return a.fade_100-b.fade_100;})
                .findIndex(function(r){return r.battery_id===t.battery_id;})+1;
  document.getElementById('hd2').textContent='Battery '+t.battery_id+' vs the other '+(BENCH.length-1);
  document.getElementById('hdsub2').textContent='Selected vehicle '+t.vehicle_id+' · ranks #'+rank+' of '+BENCH.length+' on fade rate (slowest fade = #1)';
  if(chart2){chart2.destroy();chart2=null;}
  rows.sort(function(a,b){return m.hi?b[m.key]-a[m.key]:a[m.key]-b[m.key];});
  chart2=new Chart(document.getElementById('bars'),{type:'bar',
    data:{labels:rows.map(function(r){return r.battery_id;}),
      datasets:[{data:rows.map(function(r){return r[m.key];}),
        backgroundColor:rows.map(function(r){return r.battery_id===t.battery_id?HI:GREY;}),borderRadius:4}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},
      tooltip:{callbacks:{label:function(c){return m.lab+': '+c.parsed.y.toLocaleString()+
        '  (n='+rows[c.dataIndex].n+' cycles)';}}}},
      scales:{y:{beginAtZero:true,title:{display:true,text:m.lab}},x:{grid:{display:false}}}}});
  document.getElementById('tblwrap').innerHTML='<table><thead><tr><th>Battery</th><th>Cycles on record</th>'+
    '<th>Full life (cycles)</th><th>Discharge time new (s)</th><th>Near end (s)</th><th>Fade /100 cycles (s)</th></tr></thead><tbody>'+
    rows.map(function(r){return '<tr class="'+(r.battery_id===t.battery_id?'me':'')+'">'+
      '<td class="bid">'+r.battery_id+'</td><td>'+r.n.toLocaleString()+'</td>'+
      '<td>'+Math.round(r.full_life).toLocaleString()+'</td><td>'+Math.round(r.start_dt).toLocaleString()+'</td>'+
      '<td>'+Math.round(r.end_dt).toLocaleString()+'</td><td>'+r.fade_100.toFixed(1)+'</td></tr>';}).join('')+'</tbody></table>';
  document.getElementById('note').innerHTML=
    'All 14 batteries were tested under the same lab conditions, so full life is nearly identical (~1,100 cycles). '+
    'Fade rate — how fast discharge time shrinks — is where they differ, and it is the best early warning of a weaker pack. '+
    'Highlighted = selected vehicle\'s battery.<br>Source: Battery RUL dataset (Hawaii Natural Energy Institute, via Kaggle, CC0). '+
    'Pack cost, usage rate and fleet size are planning assumptions.';}
fillOpts(VEH); render(0);
</script>

<script>
const PLANS={"12": {"months": 12, "u10": 64.0, "u50": 72.5, "u90": 81.0, "c10": 819200.0, "c50": 928000.0, "c90": 1036800.0, "per_vehicle_yr": 4640.0, "rows": [{"quarter": "Q1", "u10": 12.0, "u50": 15.0, "u90": 18.0, "spend": 192000.0}, {"quarter": "Q2", "u10": 12.0, "u50": 16.0, "u90": 21.0, "spend": 204800.0}, {"quarter": "Q3", "u10": 16.0, "u50": 20.0, "u90": 26.0, "spend": 256000.0}, {"quarter": "Q4", "u10": 15.0, "u50": 20.0, "u90": 26.0, "spend": 256000.0}]}, "24": {"months": 24, "u10": 132.0, "u50": 145.0, "u90": 156.1, "c10": 1689600.0, "c50": 1856000.0, "c90": 1998080.0, "per_vehicle_yr": 4640.0, "rows": [{"quarter": "Q1", "u10": 12.0, "u50": 15.0, "u90": 18.0, "spend": 192000.0}, {"quarter": "Q2", "u10": 12.0, "u50": 16.0, "u90": 21.0, "spend": 204800.0}, {"quarter": "Q3", "u10": 16.0, "u50": 20.0, "u90": 26.0, "spend": 256000.0}, {"quarter": "Q4", "u10": 15.0, "u50": 20.0, "u90": 26.0, "spend": 256000.0}, {"quarter": "Q5", "u10": 14.0, "u50": 19.0, "u90": 24.0, "spend": 243200.0}, {"quarter": "Q6", "u10": 14.0, "u50": 18.0, "u90": 24.0, "spend": 230400.0}, {"quarter": "Q7", "u10": 13.0, "u50": 18.0, "u90": 23.0, "spend": 230400.0}, {"quarter": "Q8", "u10": 11.0, "u50": 16.0, "u90": 21.0, "spend": 204800.0}]}}, PMETA={"scope": "All 14 batteries", "fleet_n": 200, "pack_cost": 12000, "swap_at": 50, "early_rate": 0.12};
let HZ=24, chart3=null;
function setH(h){HZ=h;[12,24].forEach(function(k){
  document.getElementById('h_'+k).classList.toggle('on',k===h);}); draw3();}
function draw3(){var P=PLANS[String(HZ)];
  var ACC=getComputedStyle(document.body).getPropertyValue('--acc').trim()||'#1f77b4';
  document.getElementById('hd3').textContent='Replacement plan — '+PMETA.scope;
  document.getElementById('hdsub3').textContent=
    PMETA.fleet_n.toLocaleString()+' vehicles · packs reaching the swap point ('+PMETA.swap_at+
    ' cycles left) · excludes surprise failures';
  var M=function(x){return '$'+(x/1e6).toFixed(2)+'M';};
  document.getElementById('ptiles').innerHTML=
    '<div class="tile"><div class="tlab">Packs to buy (P50)</div><div class="tval">'+
      Math.round(P.u50).toLocaleString()+'</div></div>'+
    '<div class="tile"><div class="tlab">Range P10–P90</div><div class="tval">'+
      Math.round(P.u10).toLocaleString()+'<small> – '+Math.round(P.u90).toLocaleString()+'</small></div></div>'+
    '<div class="tile"><div class="tlab">Budget (P50)</div><div class="tval">'+M(P.c50)+'</div></div>'+
    '<div class="tile"><div class="tlab">Plan against (P90)</div><div class="tval">'+M(P.c90)+'</div></div>'+
    '<div class="tile"><div class="tlab">Per vehicle / year</div><div class="tval">$'+
      Math.round(P.per_vehicle_yr).toLocaleString()+'</div></div>';
  var rows=P.rows;
  if(chart3)chart3.destroy();
  chart3=new Chart(document.getElementById('pbars'),{type:'bar',
    data:{labels:rows.map(function(r){return r.quarter;}),
      datasets:[{data:rows.map(function(r){return r.spend;}),backgroundColor:ACC,borderRadius:4}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},
      tooltip:{callbacks:{label:function(c){var r=rows[c.dataIndex];
        return '$'+Math.round(r.spend).toLocaleString()+'  ·  '+Math.round(r.u50)+' packs (range '+
               Math.round(r.u10)+'–'+Math.round(r.u90)+')';}}}},
      scales:{y:{beginAtZero:true,title:{display:true,text:'Estimated spend ($)'},
        ticks:{callback:function(v){return '$'+(v/1e3).toFixed(0)+'K';}}},x:{grid:{display:false}}}}});
  document.getElementById('ptbl').innerHTML='<table><thead><tr><th>Quarter</th><th>Buy (P50)</th>'+
    '<th>Range P10–P90</th><th>Pack + labor</th><th>Est. spend</th></tr></thead><tbody>'+
    rows.map(function(r){return '<tr><td class="bid">'+r.quarter+'</td><td>'+
      Math.round(r.u50).toLocaleString()+'</td><td>'+Math.round(r.u10)+' – '+Math.round(r.u90)+
      '</td><td>$'+(PMETA.pack_cost+800).toLocaleString()+'</td><td>$'+
      Math.round(r.spend).toLocaleString()+'</td></tr>';}).join('')+'</tbody></table>';
  document.getElementById('pnote').innerHTML=
    '<b>Budget against P90, not P50</b> — the midpoint is wrong half the time. Counts come from the '+
    'validated battery-life model over '+HZ+' months (200 simulations). Excludes surprise failures: '+
    'the model is too optimistic on '+Math.round(PMETA.early_rate*100)+'% of forecasts (measured on unseen batteries), '+
    'mostly in the red zone, which adds roughly 8% to the budget. Pack cost ($'+
    PMETA.pack_cost.toLocaleString()+') is a planning assumption.';}
</script>
